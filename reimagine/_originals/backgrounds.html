<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Background concepts</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet" />
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#050505; color:#ededed; font-family:Inter,sans-serif; padding:40px 20px 80px; }
  h1 { font:900 34px Outfit; letter-spacing:-.02em; text-align:center; } h1 span { color:#ef4444; }
  .sub { text-align:center; color:#8a8a8a; font:13px 'JetBrains Mono'; margin:6px 0 34px; }
  h2.grp { max-width:1300px; margin:30px auto 14px; font:600 12px 'JetBrains Mono'; letter-spacing:.12em; color:#8a8a8a; text-transform:uppercase; display:flex; gap:12px; align-items:center; } h2.grp::after { content:''; flex:1; height:1px; background:rgba(255,255,255,.09); } h2.grp b { color:#ef4444; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:26px; max-width:1300px; margin:0 auto; }
  .item .cap { display:flex; justify-content:space-between; gap:10px; font:600 13px 'JetBrains Mono'; color:#8a8a8a; margin-bottom:9px; } .item .cap b { color:#ef4444; font-weight:600; }
  .item p { font-size:13px; color:#8a8a8a; margin-top:9px; line-height:1.55; }

  /* each panel is a mini page; --bg/--fg/... set by .dk / .lt */
  .pn { position:relative; aspect-ratio:16/10; border-radius:14px; overflow:hidden; border:1px solid rgba(255,255,255,.1); background:var(--bg); color:var(--fg); isolation:isolate; }
  .dk { --bg:#09090b; --fg:#fafafa; --card:#0e0e11; --mu:#9b9ba3; --bd:rgba(255,255,255,.09); }
  .lt { --bg:#faf7f2; --fg:#1a1411; --card:#ffffff; --mu:#6a615b; --bd:rgba(41,28,20,.12); }
  .pn canvas.bgc, .pn .layer { position:absolute; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }
  .mock { position:absolute; inset:0; z-index:2; padding:7% 9%; display:flex; flex-direction:column; pointer-events:none; }
  .mock .nav { height:24px; border-radius:999px; border:1px solid var(--bd); background:color-mix(in oklab,var(--bg) 70%,transparent); backdrop-filter:blur(6px); width:74%; margin:0 auto 9%; }
  .mock .lab { font:600 9px 'JetBrains Mono'; letter-spacing:.12em; color:var(--mu); display:flex; gap:8px; align-items:center; margin-bottom:10px; } .mock .lab span { color:#ef4444; } .mock .lab::after { content:''; flex:1; height:1px; background:var(--bd); }
  .mock h3 { font:900 clamp(18px,2.6vw,32px)/1 Outfit; letter-spacing:-.03em; margin-bottom:14px; } .mock h3 span { color:#ef4444; }
  .mock .cards { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:auto; }
  .mock .c { height:62px; border-radius:12px; border:1px solid var(--bd); background:var(--card); padding:10px; } .mock .c i { display:block; height:7px; border-radius:4px; background:var(--bd); margin-bottom:6px; } .mock .c i:first-child { width:60%; background:color-mix(in oklab,var(--fg) 30%,transparent); } .mock .c i:last-child { width:85%; }

  /* D1 aurora */
  .aur span { position:absolute; border-radius:50%; filter:blur(60px); opacity:.5; animation:drift 18s ease-in-out infinite alternate; }
  .aur span:nth-child(1) { width:55%; height:60%; left:-15%; top:-20%; background:#7f1d1d; }
  .aur span:nth-child(2) { width:45%; height:55%; right:-15%; top:30%; background:#ef4444; opacity:.22; animation-duration:22s; }
  .aur span:nth-child(3) { width:40%; height:40%; left:30%; bottom:-25%; background:#450a0a; animation-duration:26s; }
  @keyframes drift { to { transform:translate(12%,10%) scale(1.15); } }
  .grain { position:absolute; inset:0; opacity:.08; mix-blend-mode:overlay; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

  /* D4 spotlight grid */
  .spot .g { position:absolute; inset:0; background-size:28px 28px; background-image:linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 0),linear-gradient(180deg,rgba(255,255,255,.035) 1px,transparent 0); }
  .spot .lit { position:absolute; inset:0; background-size:28px 28px; background-image:linear-gradient(90deg,rgba(239,68,68,.55) 1px,transparent 0),linear-gradient(180deg,rgba(239,68,68,.55) 1px,transparent 0); -webkit-mask:radial-gradient(circle 120px at var(--mx,50%) var(--my,50%),#000,transparent 70%); mask:radial-gradient(circle 120px at var(--mx,50%) var(--my,50%),#000,transparent 70%); }
  .spot .glow { position:absolute; inset:0; background:radial-gradient(circle 160px at var(--mx,50%) var(--my,50%),rgba(239,68,68,.12),transparent 70%); }

  /* D6 horizon floor */
  .floor { perspective:300px; }
  .floor .sky { position:absolute; inset:0; background:radial-gradient(ellipse 70% 40% at 50% 62%,rgba(239,68,68,.28),transparent 70%); }
  .floor .plane { position:absolute; left:-50%; right:-50%; top:62%; height:120%; transform-origin:top; transform:rotateX(72deg); background-size:40px 40px; background-image:linear-gradient(90deg,rgba(239,68,68,.35) 1px,transparent 0),linear-gradient(180deg,rgba(239,68,68,.35) 1px,transparent 0); animation:run 3s linear infinite; -webkit-mask:linear-gradient(#000,transparent 70%); mask:linear-gradient(#000,transparent 70%); }
  @keyframes run { to { background-position:0 40px; } }
  .floor .hz { position:absolute; left:0; right:0; top:62%; height:1px; background:linear-gradient(90deg,transparent,rgba(239,68,68,.7),transparent); }

  /* L1 warm blobs + grain */
  .blobs span { position:absolute; border-radius:50%; filter:blur(50px); animation:drift 20s ease-in-out infinite alternate; }
  .blobs span:nth-child(1) { width:50%; height:55%; left:-10%; top:-15%; background:#fde2d3; }
  .blobs span:nth-child(2) { width:45%; height:50%; right:-12%; top:25%; background:#fecaca; opacity:.7; animation-duration:24s; }
  .blobs span:nth-child(3) { width:40%; height:40%; left:35%; bottom:-20%; background:#f3e8d6; animation-duration:28s; }
  .lt .grain { opacity:.18; mix-blend-mode:multiply; }

  /* L2 dot paper */
  .dotp .d { position:absolute; inset:0; background-size:18px 18px; background-image:radial-gradient(circle,rgba(41,28,20,.22) 1.1px,transparent 1.3px); }
  .dotp .d2 { position:absolute; inset:0; background-size:18px 18px; background-image:radial-gradient(circle,#ef4444 1.8px,transparent 2px); -webkit-mask:radial-gradient(circle 90px at var(--mx,50%) var(--my,50%),#000,transparent 75%); mask:radial-gradient(circle 90px at var(--mx,50%) var(--my,50%),#000,transparent 75%); }

  /* L3 drafting grid */
  .draft .g1 { position:absolute; inset:0; background-size:14px 14px; background-image:linear-gradient(90deg,rgba(41,28,20,.04) 1px,transparent 0),linear-gradient(180deg,rgba(41,28,20,.04) 1px,transparent 0); }
  .draft .g2 { position:absolute; inset:0; background-size:70px 70px; background-image:linear-gradient(90deg,rgba(41,28,20,.09) 1px,transparent 0),linear-gradient(180deg,rgba(41,28,20,.09) 1px,transparent 0); }
  .draft .ruler { position:absolute; top:0; bottom:0; width:16px; background:repeating-linear-gradient(180deg,rgba(41,28,20,.35) 0 1px,transparent 1px 14px); -webkit-mask:linear-gradient(90deg,#000 40%,transparent); mask:linear-gradient(90deg,#000 40%,transparent); }
  .draft .ruler.l { left:0; } .draft .ruler.r { right:0; transform:scaleX(-1); }
  .draft .mark { position:absolute; right:7%; top:14%; width:70px; height:70px; border:1px dashed rgba(239,68,68,.5); border-radius:50%; } .draft .mark::before, .draft .mark::after { content:''; position:absolute; background:rgba(239,68,68,.5); } .draft .mark::before { left:50%; top:-10px; bottom:-10px; width:1px; } .draft .mark::after { top:50%; left:-10px; right:-10px; height:1px; }

  /* L4 mesh */
  .mesh { background:radial-gradient(at 15% 20%,#fde7da 0,transparent 50%),radial-gradient(at 85% 15%,#f6efe4 0,transparent 50%),radial-gradient(at 70% 85%,#fdd9d9 0,transparent 50%),radial-gradient(at 20% 90%,#efe6d6 0,transparent 50%); background-size:160% 160%; animation:mesh 16s ease-in-out infinite alternate; }
  @keyframes mesh { to { background-position:100% 100%; } }

  @media (max-width:900px) { .grid { grid-template-columns:1fr; } }
</style>
</head>
<body>
<h1>Background <span>concepts</span></h1>
<div class="sub">each panel is a mini page · move your cursor over them (some react to it) · all stay subtle so content reads first</div>

<h2 class="grp"><b>●</b> Dark mode</h2>
<div class="grid" id="dark"></div>
<h2 class="grp"><b>○</b> Light mode</h2>
<div class="grid" id="light"></div>

<script>
const MOCK = (t) => `<div class="mock"><div class="nav"></div><div class="lab"><span>//</span> FEATURED PROJECTS</div><h3>${t}</h3><div class="cards"><div class="c"><i></i><i></i><i></i></div><div class="c"><i></i><i></i><i></i></div></div></div>`;
const D = [
  ['D1', 'aurora', 'Slow, blurred crimson glows drifting in the corners with a fine film grain. Moody and premium, no dots.', `<div class="layer aur"><span></span><span></span><span></span></div><div class="layer grain"></div>`],
  ['D2', 'constellation', 'Tiny particles drift slowly; near your cursor they link up with faint lines, red closest to you.', `<canvas class="bgc" data-k="const"></canvas>`],
  ['D3', 'topographic', 'Moving contour lines like a terrain map, one line in red. Calm, techy, works well behind text.', `<canvas class="bgc" data-k="topo"></canvas>`],
  ['D4', 'spotlight grid', 'A faint grid that lights up red only around your cursor, like a torch on graph paper.', `<div class="layer spot"><div class="g"></div><div class="glow"></div><div class="lit"></div></div>`],
  ['D5', 'code rain', 'Very faint code characters falling at the left and right edges only (content column stays clear). Developer vibe.', `<canvas class="bgc" data-k="rain"></canvas>`],
  ['D6', 'horizon floor', 'A red perspective grid gliding toward you at the bottom with a glowing horizon line. Bold, retro-futuristic.', `<div class="layer floor"><div class="sky"></div><div class="plane"></div><div class="hz"></div></div>`],
];
const L = [
  ['L1', 'warm glow + grain', 'Soft peach and rose glows drifting over warm paper with a fine grain, like a printed poster.', `<div class="layer blobs"><span></span><span></span><span></span></div><div class="layer grain"></div>`],
  ['L2', 'dot paper', 'Notebook dot-grid paper; dots near your cursor turn red, like a magnifier.', `<div class="layer dotp"><div class="d"></div><div class="d2"></div></div>`],
  ['L3', 'drafting sheet', 'Fine engineering grid with bolder major lines, ruler ticks on the edges and a red crosshair mark. Architect\'s desk.', `<div class="layer draft"><div class="g1"></div><div class="g2"></div><div class="ruler l"></div><div class="ruler r"></div><div class="mark"></div></div>`],
  ['L4', 'mesh gradient', 'A soft cream, rose and sand mesh that slowly shifts. Clean and modern, no pattern at all.', `<div class="layer mesh"></div>`],
  ['L5', 'silk lines', 'Thin flowing lines drifting like silk threads in warm grey, one in red. Elegant movement.', `<canvas class="bgc" data-k="silk"></canvas>`],
  ['L6', 'halftone corners', 'Print-style halftone dots that grow from the corners and vanish toward the middle, gently breathing.', `<canvas class="bgc" data-k="half"></canvas>`],
];
const render = (el, list, cls) => el.innerHTML = list.map(([id, name, desc, bg]) => `<div class="item"><div class="cap"><span><b>${id}</b> — ${name}</span></div><div class="pn ${cls}" data-id="${id}">${bg}${MOCK(cls === 'dk' ? 'Things I\'ve <span>built</span>.' : 'Things I\'ve <span>built</span>.')}</div><p>${desc}</p></div>`).join('');
render(document.getElementById('dark'), D, 'dk');
render(document.getElementById('light'), L, 'lt');

// cursor position for the CSS spotlight/magnifier panels
document.querySelectorAll('.pn').forEach((p) => p.addEventListener('pointermove', (e) => { const r = p.getBoundingClientRect(); p.style.setProperty('--mx', e.clientX - r.left + 'px'); p.style.setProperty('--my', e.clientY - r.top + 'px'); p.dataset.mx = e.clientX - r.left; p.dataset.my = e.clientY - r.top; }));
document.querySelectorAll('.pn').forEach((p) => p.addEventListener('pointerleave', () => { delete p.dataset.mx; }));

// canvas backgrounds
const painters = {
  const(c, ctx, W, H, p) {
    const pts = Array.from({ length: 70 }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .25, vy: (Math.random() - .5) * .25 }));
    return () => {
      ctx.clearRect(0, 0, W, H); const mx = +p.dataset.mx, my = +p.dataset.my, has = p.dataset.mx !== undefined;
      pts.forEach((q) => { q.x = (q.x + q.vx + W) % W; q.y = (q.y + q.vy + H) % H; ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(q.x, q.y, 1.6, 1.6); });
      if (has) pts.forEach((a, i) => { const da = Math.hypot(a.x - mx, a.y - my); if (da > 130) return; pts.slice(i + 1).forEach((b) => { const d = Math.hypot(a.x - b.x, a.y - b.y); if (d < 70) { ctx.strokeStyle = `rgba(239,68,68,${(1 - da / 130) * (1 - d / 70) * .9})`; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); } }); });
    };
  },
  topo(c, ctx, W, H) {
    let t = 0;
    return () => {
      t += .004; ctx.clearRect(0, 0, W, H);
      for (let k = 0; k < 14; k++) {
        ctx.beginPath(); ctx.strokeStyle = k === 6 ? 'rgba(239,68,68,.55)' : 'rgba(255,255,255,.07)'; ctx.lineWidth = k === 6 ? 1.2 : 1;
        for (let x = 0; x <= W; x += 6) { const y = H * (k / 13) + Math.sin(x * .012 + t * 2 + k * .6) * 18 + Math.cos(x * .006 - t + k) * 22; x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
        ctx.stroke();
      }
    };
  },
  rain(c, ctx, W, H) {
    const CH = '01{}<>/=;()[]constletfn'.split(''), fs = 11, cols = Math.floor(W / fs), drops = Array.from({ length: cols }, () => Math.random() * H / fs);
    ctx.font = `${fs}px JetBrains Mono`;
    return () => {
      ctx.fillStyle = 'rgba(9,9,11,.18)'; ctx.fillRect(0, 0, W, H);
      drops.forEach((y, i) => { const x = i * fs, edge = Math.min(x, W - x) / W; if (edge > .2) return; const a = (1 - edge / .2) * .5; ctx.fillStyle = Math.random() < .04 ? `rgba(239,68,68,${a + .2})` : `rgba(255,255,255,${a * .5})`; ctx.fillText(CH[Math.floor(Math.random() * CH.length)], x, y * fs); drops[i] = y * fs > H && Math.random() > .97 ? 0 : y + .35; });
    };
  },
  silk(c, ctx, W, H) {
    let t = 0;
    return () => {
      t += .006; ctx.clearRect(0, 0, W, H);
      for (let k = 0; k < 9; k++) {
        ctx.beginPath(); ctx.strokeStyle = k === 4 ? 'rgba(239,68,68,.45)' : 'rgba(41,28,20,.09)'; ctx.lineWidth = k === 4 ? 1.3 : 1;
        for (let x = -10; x <= W + 10; x += 8) { const y = H * .62 + Math.sin(x * .008 + t + k * .35) * (30 + k * 4) + Math.sin(x * .003 - t * .7) * 40 - k * 9; x > -10 ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
        ctx.stroke();
      }
    };
  },
  half(c, ctx, W, H) {
    let t = 0; const S = 12;
    return () => {
      t += .01; ctx.clearRect(0, 0, W, H); ctx.fillStyle = 'rgba(41,28,20,.22)';
      for (let y = 0; y < H + S; y += S) for (let x = 0; x < W + S; x += S) {
        const d = Math.min(Math.hypot(x, y), Math.hypot(W - x, y), Math.hypot(x, H - y), Math.hypot(W - x, H - y)) / Math.hypot(W, H);
        const r = Math.max(0, (.42 - d) * 13 + Math.sin(t + x * .02 + y * .02) * .6);
        if (r > .3) { ctx.beginPath(); ctx.arc(x, y, Math.min(r, 5), 0, 7); ctx.fill(); }
      }
    };
  },
};
document.querySelectorAll('canvas.bgc').forEach((c) => {
  const p = c.closest('.pn'), dpr = Math.min(2, devicePixelRatio || 1), W = p.clientWidth, H = p.clientHeight;
  c.width = W * dpr; c.height = H * dpr; const ctx = c.getContext('2d'); ctx.scale(dpr, dpr);
  const step = painters[c.dataset.k](c, ctx, W, H, p); let on = false, raf;
  const loop = () => { step(); if (on) raf = requestAnimationFrame(loop); };
  new IntersectionObserver(([e]) => { on = e.isIntersecting; cancelAnimationFrame(raf); if (on) loop(); }).observe(p);
});
</script>
</body>
</html>
